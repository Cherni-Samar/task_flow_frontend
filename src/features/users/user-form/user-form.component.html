<div class="dashboard-layout">

    <!-- Sidebar -->
    <app-sidebar></app-sidebar>

    <!-- Main Content -->
    <div class="main-content">

        <!-- Navbar -->
        <app-navbar></app-navbar>

        <!-- Page -->
        <div class="page-content">

            <div class="form-page">

                <div class="form-card">

                    <h2>

                        <i class="bi bi-person-plus-fill me-2"></i>

                        {{ id ? 'Modifier utilisateur' : 'Ajouter utilisateur' }}

                    </h2>

                    <!-- Nom -->

                    <div class="mb-3">

                        <label>

                            Nom complet

                        </label>

                        <input
                            class="form-control"
                            [(ngModel)]="fullName">

                    </div>

                    <!-- Email -->

                    <div class="mb-3">

                        <label>

                            Email

                        </label>

                        <input
                            class="form-control"
                            type="email"
                            [(ngModel)]="email">

                    </div>

                    <!-- Password -->

                    <div class="mb-3">

                        <label>

                            Mot de passe

                        </label>

                        <input
                            class="form-control"
                            type="password"
                            [(ngModel)]="password">

                    </div>

                    <!-- Job -->

                    <div class="mb-3">

                        <label>

                            Poste

                        </label>

                        <select
                            class="form-control"
                            [(ngModel)]="jobTitle">

                            <option
                                *ngFor="let job of jobTitles"
                                [ngValue]="job">

                                {{ job }}

                            </option>

                        </select>

                    </div>

                    <!-- Roles -->

                    <div class="mb-4">

                        <label>

                            Rôles

                        </label>

                        <div class="roles-container">

                            <div
                                *ngFor="let role of roles"
                                class="role-item">

                                <input
                                    type="checkbox"
                                    [checked]="selectedRoles.includes(role.id)"
                                    (change)="toggleRole(role.id)">

                                <span>

                                    {{ role.name }}

                                </span>

                            </div>

                        </div>

                    </div>

                    <!-- Button -->

                    <button
                        class="btn btn-primary w-100"
                        (click)="save()"
                        [disabled]="loading ||!isFormValid()">

                        <i class="bi bi-check-circle me-2"></i>

                        {{ loading ? 'Sauvegarde...' : 'Enregistrer' }}

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
